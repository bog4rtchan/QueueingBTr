<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue history</title>
<link rel="stylesheet" href="style.css">
<style>
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: .9rem 1.5rem; border-bottom: 1px solid var(--line); }
  header h1 { font: 700 1.6rem/1 var(--display); margin: 0; }
  header a { color: var(--ink); font-weight: 600; }
  main { padding: 1rem 1.5rem 2rem; }
  #warn { margin: 0; padding: .6rem 1.5rem; background: #FDECEA; color: var(--stop); font-weight: 600; }
  #warn:empty { display: none; }
  .filter { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 0 0 1rem; padding: 0; border: 0; }
  .filter legend { float: left; font-weight: 600; margin-right: .5rem; padding: 0; }
  .filter label { position: relative; }
  .filter input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .filter span { display: block; font: 700 1.3rem/1 var(--display); padding: .5rem 1rem; border: 2px solid var(--ink); border-radius: 6px; }
  .filter input:checked + span { background: var(--ink); color: var(--paper); }
  .filter input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 3px; }
  .filter label:hover input:not(:checked) + span { background: #fff; }
  table { border-collapse: collapse; width: 100%; max-width: 56rem; }
  th, td { text-align: left; padding: .4rem .8rem .4rem 0; border-bottom: 1px solid var(--line); }
  th { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
  .tag { display: inline-block; min-width: 3rem; padding: .15rem .45rem; border-radius: 4px; font: 700 1.1rem/1 var(--display);
    background: var(--lane); color: var(--on-lane); }
</style>
</head>
<body>
<header>
  <h1>Queue history</h1>
  <a href="control.html">Back to queue control</a>
</header>
<p id="warn" role="alert"></p>
<main>
  <fieldset class="filter" id="filter">
    <legend>Show</legend>
    <label><input type="radio" name="histq" value="" checked><span>All</span></label>
    <label><input type="radio" name="histq" value="A"><span>ATAP</span></label>
    <label><input type="radio" name="histq" value="C"><span>CL</span></label>
  </fieldset>
  <table>
    <thead><tr><th scope="col">Time</th><th scope="col">Ticket</th><th scope="col">Queue</th><th scope="col">State</th><th scope="col">Counter</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody>
  </table>
</main>
<script>
const QUEUE_NAME = { A: 'ATAP', C: 'CL' };
const STATE_LABEL = { add: 'Issued', next: 'Called', recall: 'Repeat call', skip: 'Skipped', unskip: 'Brought back',
  insert: 'Added to line', missing: 'Marked missing', found: 'Unmarked missing', reset: 'Started over' };
const warn = document.getElementById('warn');
let entries = [], lastJson = '';

function draw() {
  const only = document.querySelector('input[name="histq"]:checked').value;
  const today = new Date().toDateString();
  const rows = entries.filter((e) => !only || e.queue === only).reverse().map((e) => {
    const d = new Date(e.at);
    const time = d.toDateString() === today ? d.toLocaleTimeString() : d.toLocaleString();
    return `<tr><td>${time}</td><td>${e.number ? `<span class="tag lane-${e.queue}">${e.queue}${e.number}</span>` : '–'}</td>
      <td>${QUEUE_NAME[e.queue] ?? e.queue}</td><td>${STATE_LABEL[e.type] ?? e.type}</td>
      <td>${e.counter ? `Counter ${e.counter}` : '–'}</td></tr>`;
  });
  document.getElementById('rows').innerHTML = rows.join('') || '<tr><td colspan="5">Nothing yet.</td></tr>';
}

// shortcut: polls every 2s like the other pages; fine for an office, switch to push if many people keep it open.
async function poll() {
  if (document.hidden) return;
  try {
    const json = await (await fetch('/history', { cache: 'no-store' })).text();
    warn.textContent = '';
    if (json === lastJson) return; // redraw only on change, so scrolling and focus aren't disturbed
    lastJson = json;
    entries = JSON.parse(json);
    draw();
  } catch {
    warn.textContent = 'Can’t reach the server. Start it with: node server.js';
  }
}
document.getElementById('filter').addEventListener('change', draw);
poll();
setInterval(poll, 2000);
document.addEventListener('visibilitychange', poll);
</script>
</body>
</html>
