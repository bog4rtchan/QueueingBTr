<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue history</title>
<link rel="stylesheet" href="style.css">
<style>
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: .9rem 1.5rem; border-bottom: 1px solid var(--line); }
  header h1 { font: 700 1.6rem/1 var(--display); margin: 0; }
  header a { color: var(--ink); font-weight: 600; }
  main { padding: 1.25rem 1.5rem 3rem; }
  #warn { margin: 0; padding: .6rem 1.5rem; background: #FDECEA; color: var(--stop); font-weight: 600; }
  #warn:empty { display: none; }

  /* One column per queue: its card (current round, since the last Start over) above its own table. */
  #queues { display: grid; grid-template-columns: repeat(auto-fit, minmax(24rem, 1fr)); gap: 1.5rem; align-items: start; }
  .card { background: var(--lane); color: var(--on-lane); border-radius: 8px 8px 0 0; padding: 1rem 1.25rem; }
  .card h2 { font: 700 1.5rem/1.1 var(--display); margin: 0 0 .7rem; }
  .card h2 small { font: 400 .9rem var(--text); margin-left: .4rem; }
  .card dl { display: flex; gap: 1.5rem; margin: 0; }
  .card dd { font: 900 2.4rem/1 var(--display); margin: 0; }
  .card dt { font-size: .85rem; }
  .card div { display: flex; flex-direction: column-reverse; }

  .legend { display: flex; justify-content: flex-end; gap: 1rem; margin: 0 0 .9rem; padding: 0; list-style: none; font-size: .9rem; }
  .legend li { display: flex; align-items: center; gap: .4rem; }

  .sheet { background: #fff; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; overflow: clip; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  th, td { text-align: left; padding: .55rem 1rem; border-bottom: 1px solid #E2E7E4; }
  thead th { position: sticky; top: 0; background: var(--ink); color: var(--paper); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #F5F7F5; }
  .tag { display: inline-block; min-width: 3.2rem; padding: .2rem .5rem; border-radius: 4px; text-align: center; font: 700 1.25rem/1 var(--display);
    background: var(--lane); color: var(--on-lane); }
  .counter { font: 700 1.15rem/1 var(--display); }
  .none { color: #9AA6A1; }

  /* Status circles: mark + colour, so they read without telling red from green.
     The line into each circle shows the ticket's progress across the three steps. */
  .status { text-align: center; position: relative; }
  td.status + td.status::before { content: ''; position: absolute; top: 50%; left: -50%; right: 50%; height: 3px; margin-top: -1.5px; background: #D5DBD8; }
  td.status.done + td.status.done::before { background: var(--go); }
  td.status.skip + td.status.skip::before { background: var(--stop); }
  .dot { position: relative; z-index: 1; vertical-align: middle; display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; font: 700 .95rem/1 var(--text); }
  .dot.done { background: var(--go); color: #fff; }
  .dot.todo { background: #fff; border: 2px solid #9AA6A1; }
  .dot.skip { background: var(--stop); color: #fff; }
  tr.out td { background: #FDF3F2; }
  tr.out .tag { opacity: .55; }

  tr.reset td { background: var(--paper); padding: .4rem 1rem; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #4A5A66; }
  tr.reset:hover td { background: var(--paper); }
  .empty td { text-align: center; padding: 2rem; color: #4A5A66; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>Queue history</h1>
  <a href="control.html">Back to queue control</a>
</header>
<p id="warn" role="alert"></p>
<main>
  <ul class="legend" aria-label="Legend">
    <li><span class="dot done" aria-hidden="true">✓</span>Done</li>
    <li><span class="dot todo" aria-hidden="true"></span>Not yet</li>
    <li><span class="dot skip" aria-hidden="true">✕</span>Skipped</li>
  </ul>
  <div id="queues"></div>
</main>
<script>
const QUEUE_NAME = { A: 'ATAP', C: 'CL' };
const QUEUE_FULL = { A: 'Authority to Accept Payment', C: 'Confirmation Letter' };
const warn = document.getElementById('warn');
let entries = [], lastJson = '';

// One row per ticket, built by replaying the server's event log. Start over adds a divider row and starts
// fresh numbering, so each round's A1, A2… stay together. `out` = skipped, or still waiting at Start over.
function tickets() {
  const rows = [], maps = { A: new Map(), C: new Map() };
  const get = (e, n) => {
    let t = maps[e.queue].get(n);
    if (!t) {
      t = { queue: e.queue, number: n, called: false, counter: 0, out: false };
      maps[e.queue].set(n, t);
      rows.push(t);
    }
    return t;
  };
  for (const e of entries) {
    const map = maps[e.queue];
    if (!map) continue;
    if (e.type === 'add' || e.type === 'insert') Object.assign(get(e, e.number), { called: false, counter: 0, out: false });
    if (e.type === 'next') Object.assign(get(e, e.number), { called: true, counter: e.counter, out: false });
    if (e.type === 'back') {
      Object.assign(get(e, e.number), { called: true, counter: e.counter, out: false });
      if (e.returned) Object.assign(get(e, e.returned), { called: false, counter: 0 }); // back on queue
    }
    if (e.type === 'skip') get(e, e.number).out = true;
    if (e.type === 'unskip') get(e, e.number).out = false;
    if (e.type === 'missing' && map.has(e.number)) { map.get(e.number).hidden = true; map.delete(e.number); } // missing stubs aren't listed
    if (e.type === 'reset') {
      for (const t of map.values()) if (!t.called) t.out = true; // lost their place
      rows.push({ reset: true, queue: e.queue });
      maps[e.queue] = new Map();
    }
  }
  return { rows: rows.filter((t) => !t.hidden), current: maps };
}

const dot = (step, kind) => {
  const [mark, word] = { done: ['✓', 'done'], todo: ['', 'not yet'], skip: ['✕', 'skipped'] }[kind];
  return `<td class="status ${kind}"><span class="dot ${kind}" aria-hidden="true">${mark}</span><span class="sr">${step}: ${word}</span></td>`;
};

function draw() {
  const { rows, current } = tickets();
  document.getElementById('queues').innerHTML = Object.keys(QUEUE_NAME).map((q) => {
    const list = [...current[q].values()];
    const count = (f) => list.filter(f).length;
    const stats = [['issued', list.length], ['waiting', count((t) => !t.called && !t.out)],
      ['called', count((t) => t.called)], ['skipped', count((t) => t.out)]];
    const body = rows.filter((t) => t.queue === q).reverse().map((t) => {
      if (t.reset) return '<tr class="reset"><td colspan="5">Started over</td></tr>';
      const k = t.out ? 'skip' : 'done';
      return `<tr${t.out ? ' class="out"' : ''}><td><span class="tag lane-${q}">${q}${t.number}</span></td>
        ${dot('Issued', k)}${dot('On queue', k)}${dot('Called', t.out ? 'skip' : t.called ? 'done' : 'todo')}
        <td>${t.called ? `<span class="counter">Counter ${t.counter}</span>` : '<span class="none">–</span>'}</td></tr>`;
    }).join('') || '<tr class="empty"><td colspan="5">No tickets yet.</td></tr>';
    return `<section class="lane-${q}" aria-labelledby="h${q}">
      <div class="card"><h2 id="h${q}">${QUEUE_NAME[q]}<small>${QUEUE_FULL[q]} · this round</small></h2><dl>
        ${stats.map(([label, n]) => `<div><dt>${label}</dt><dd>${n}</dd></div>`).join('')}</dl></div>
      <div class="sheet"><table>
        <colgroup><col style="width: 20%"><col><col><col><col style="width: 24%"></colgroup>
        <thead><tr><th scope="col">Ticket</th><th scope="col" class="status">Issued</th><th scope="col" class="status">On queue</th><th scope="col" class="status">Called</th><th scope="col">Counter</th></tr></thead>
        <tbody>${body}</tbody></table></div>
    </section>`;
  }).join('');
}

// shortcut: polls every 2s like the other pages; fine for an office, switch to push if many people keep it open.
async function poll() {
  if (document.hidden) return;
  try {
    const json = await (await fetch('/history', { cache: 'no-store' })).text();
    warn.textContent = '';
    if (json === lastJson) return; // redraw only on change, so scrolling and focus aren't disturbed
    lastJson = json;
    entries = JSON.parse(json);
    draw();
  } catch {
    warn.textContent = 'Can’t reach the server. Start it with: node server.js';
  }
}
poll();
setInterval(poll, 2000);
document.addEventListener('visibilitychange', poll);
</script>
</body>
</html>
