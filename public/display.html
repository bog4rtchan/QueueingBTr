<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now serving</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: var(--ink); color: var(--paper); overflow: hidden; }
  h1 { font: 700 7vh/1 var(--display); margin: 0; padding: 2.2vh 4vw; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }
  section { background: var(--lane); color: var(--on-lane); padding: 4vh 4vw; display: flex; flex-direction: column; overflow: hidden; }
  h2 { font: 600 5vh/1.2 var(--text); margin: 0; }
  /* min-height: 0 lets the number shrink before the up-next row is pushed off screen */
  .num { flex: 1; min-height: 0; display: flex; align-items: center; font: 900 min(42vh, 24vw)/1 var(--display); margin: 0; }
  .num span { display: block; }
  .counter { margin: 0 0 3vh; font: 700 8vh/1 var(--display); }
  .counter:empty { display: none; }
  footer { display: flex; justify-content: space-between; align-items: flex-end; gap: 2vw; border-top: .4vh solid currentColor; padding-top: 2vh; }
  .next { margin: 0; font-size: 3.6vh; }
  .next b { display: inline-flex; gap: 2.5vw; margin-left: 1.5vw; font: 900 11vh/1 var(--display); vertical-align: -1vh; }
  .wait { font-size: 3.6vh; margin: 0; }
  .wait b { font: 700 5vh/1 var(--display); }
  #offline { position: fixed; bottom: 1.5vh; right: 1.5vw; background: var(--stop); color: #fff; padding: .6vh 1vw; font-size: 2.2vh; }
  #offline:empty { display: none; }
  /* Browsers only play sound after a click on the page, so the display starts behind this button. */
  #sound { position: fixed; inset: 0; width: 100%; border: 0; border-radius: 0; background: rgb(19 35 58 / .92); color: var(--paper);
    font: 700 9vh/1.1 var(--display); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
  #sound small { font: 400 3vh/1.4 var(--text); }
  #sound:focus-visible { outline: .6vh solid var(--cl); outline-offset: -1.2vh; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<h1>Now serving</h1>
<main>
  <section class="lane-A"><h2>ATAP issuance</h2><p class="num" aria-live="polite"><span id="numA">–</span></p><p class="counter" id="counterA"></p><footer><p class="next">Up next<b id="nextA"></b></p><p class="wait"><b id="waitA">0</b> waiting</p></footer></section>
  <section class="lane-C"><h2>CL issuance</h2><p class="num" aria-live="polite"><span id="numC">–</span></p><p class="counter" id="counterC"></p><footer><p class="next">Up next<b id="nextC"></b></p><p class="wait"><b id="waitC">0</b> waiting</p></footer></section>
</main>
<div id="offline" role="status"></div>
<button id="sound" type="button" autofocus>Turn on sound<small>Click once, or press OK on the TV remote</small></button>
<script>
// Voice: chained clips from public/audio/<voice>/, read digit by digit (C12 = "C, one, two").
// QUEUE_CLIP = the recording of the queue's name, played before its number. The voice is chosen on the control panel.
const QUEUE_CLIP = { A: 'Authority to Accept Payment', C: 'Confirmation Letter' };
const VOICES = ['Valkyrie', 'Halliday'];
let voice = VOICES[0];
const clips = {};
// chime is shared by both voices, so it stays in public/audio itself.
const clip = (name, v = voice) => clips[`${v}/${name}`] ??=
  Object.assign(new Audio(name === 'chime' ? 'audio/chime.wav' : `audio/${v}/${name}.wav`), { preload: 'auto' });
for (const v of VOICES) {
  ['chime', 'Now Serving', ...Object.values(QUEUE_CLIP), 'A', 'C', ...'0123456789', 'Counter1', 'Counter2', 'Counter3'].forEach((n) => clip(n, v));
}

const offline = document.getElementById('offline');
// Plays one clip; a missing/broken clip is skipped so the rest of the call still plays.
const playOne = (name, v) => new Promise((done) => {
  const a = clip(name, v);
  const skip = () => { if (name !== 'chime') offline.textContent = `Voice file missing: public/audio/${v}/${name}.wav`; done(); };
  if (a.error) return skip();
  a.currentTime = 0;
  a.onended = done;
  a.onerror = skip;
  a.play().catch(skip);
});
let speaking = Promise.resolve(); // announcements queue up instead of overlapping
const announce = (q, n, counter) => {
  // e.g. A12 at counter 2: Now Serving → Authority to Accept Payment → A → 1 → 2 → Counter2
  const v = voice; // a call keeps the voice it was made with, even if it changes while queued
  speaking = speaking.then(async () => {
    const tail = counter ? [`Counter${counter}`] : [];
    for (const name of ['chime', 'Now Serving', QUEUE_CLIP[q], q, ...String(n), ...tail]) await playOne(name, v);
  });
};

const sound = document.getElementById('sound');
sound.addEventListener('click', () => {
  sound.hidden = true; // this click is what lets the page play audio from now on
  document.documentElement.requestFullscreen?.();
});

// shortcut: polls every second instead of a push connection; fine for one TV on a LAN.
const lastCalls = {};
async function tick() {
  try {
    const s = await (await fetch('/state', { cache: 'no-store' })).json();
    if (VOICES.includes(s.voice)) voice = s.voice;
    for (const q of ['A', 'C']) {
      const { serving, calls, waiting, counter } = s[q];
      const num = document.getElementById('num' + q);
      num.textContent = serving ? q + serving : '–';
      document.getElementById('counter' + q).textContent = serving && counter ? `Counter ${counter}` : '';
      document.getElementById('wait' + q).textContent = waiting.length;
      // The next two waiting tickets (skipped ones are already left out by the server), e.g. A5 A6.
      const upNext = waiting.slice(0, 2).map((n) => `<span>${q}${n}</span>`);
      document.getElementById('next' + q).innerHTML = upNext.join('') || '<span>–</span>';
      // A new call (or repeat) slides the number up like a ticket being pulled, and is announced.
      if (lastCalls[q] !== undefined && calls > lastCalls[q]) {
        num.classList.remove('pulled'); void num.offsetWidth; num.classList.add('pulled');
        announce(q, serving, counter);
      }
      lastCalls[q] = calls;
    }
    if (offline.textContent.startsWith('Lost')) offline.textContent = ''; // keep missing-voice warnings visible
  } catch {
    offline.textContent = 'Lost connection to the queue server. Retrying…';
  }
}
tick();
setInterval(tick, 1000);
document.querySelector('main').addEventListener('click', () => document.documentElement.requestFullscreen?.());
</script>
</body>
</html>
