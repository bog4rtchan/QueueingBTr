<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue control</title>
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: .9rem 1.5rem; border-bottom: 1px solid var(--line); }
  header h1 { font: 700 1.6rem/1 var(--display); margin: 0; }
  header a { color: var(--ink); font-weight: 600; }
  header nav { display: flex; gap: 1.25rem; align-items: baseline; }
  header nav a[aria-current="page"] { text-decoration-thickness: 3px; text-underline-offset: 5px; }
  /* Two jobs, two screens: ?for=desk issues tickets, ?for=officer calls them. No ?for= shows everything. */
  body[data-role="desk"] [data-for="officer"], body[data-role="officer"] [data-for="desk"] { display: none !important; }
  body[data-role="desk"] button.issue { grid-column: 1 / -1; font: 700 2.4rem/1 var(--display); padding: 1.4rem; box-shadow: 0 6px 0 #000; }
  body[data-role="desk"] .stub strong { font-size: 4rem; }
  #warn { margin: 0; padding: .6rem 1.5rem; background: #FDECEA; color: var(--stop); font-weight: 600; }
  #warn:empty { display: none; }
  /* Password bar: only shown when the server asks for the control password (cloud/LAN). */
  #unlock { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; padding: .75rem 1.5rem; background: var(--ink); color: var(--paper); }
  #unlock[hidden] { display: none; }
  #unlock input { font: 1rem var(--text); padding: .55rem .7rem; border-radius: 6px; border: 2px solid var(--paper); min-width: 14rem; }
  #unlock input:focus-visible { outline: 3px solid var(--cl); outline-offset: 2px; }
  #unlock button { padding: .55rem 1rem; font-size: 1rem; border-color: var(--paper); background: var(--paper); color: var(--ink); box-shadow: none; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }
  .lane { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .lane:last-child { border-right: 0; }

  .board { background: var(--lane); color: var(--on-lane); padding: 1.25rem 1.5rem 1.5rem; }
  .board h2 { font: 600 1.15rem/1.3 var(--text); margin: 0; }
  .serving { font: 900 clamp(6rem, 14vw, 11rem)/.95 var(--display); margin: .4rem 0 .6rem; }
  .serving .caption { display: block; font: 400 1rem/1.4 var(--text); margin-bottom: .2rem; }
  .facts { display: flex; gap: 2rem; margin: 0; }
  .facts div { display: flex; flex-direction: column-reverse; }
  .facts dt { font-size: .9rem; }
  .facts dd { margin: 0; font: 700 2rem/1 var(--display); }

  .actions { padding: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; align-content: start; flex: 1; }
  /* Every control is a solid "key" with a darker bottom edge so it reads as pressable; it sinks when pressed. */
  button { font: 600 1.1rem/1.2 var(--text); padding: 1rem; border-radius: 8px; cursor: pointer; border: 2px solid var(--ink); background: #fff; color: var(--ink);
    box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s, background-color .12s; }
  button:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
  button:not(:disabled):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; transform: translateY(4px); }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } button:not(:disabled):hover, button:not(:disabled):active { transform: none; } }
  /* Counter picker: the Call button stays disabled until one is chosen. */
  .counters { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 0; padding: 0; border: 0; }
  .counters legend { float: left; font-weight: 600; margin-right: .5rem; padding: 0; }
  .counters label { position: relative; }
  .counters input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .counters span { display: block; font: 700 1.4rem/1 var(--display); padding: .55rem 1.1rem; border: 2px solid var(--ink); border-radius: 8px;
    background: #fff; box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  .counters label:hover input:not(:checked) + span { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
  /* Chosen = pressed in and filled, so it's clear which counter Call will use. */
  .counters input:checked + span { background: var(--ink); color: var(--paper); transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .counters input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 4px; }
  .voice { margin-left: auto; }
  .voice span { font-size: 1.1rem; padding: .4rem .9rem; box-shadow: 0 3px 0 var(--ink); }
  button.call { grid-column: 1 / -1; font: 700 2.2rem/1 var(--display); padding: 1.2rem; background: var(--lane); color: var(--on-lane); box-shadow: 0 6px 0 var(--ink); }
  button.call:not(:disabled):hover { filter: brightness(1.08); box-shadow: 0 7px 0 var(--ink); }
  button.call:not(:disabled):active { box-shadow: 0 1px 0 var(--ink); transform: translateY(5px); }
  button.call:disabled { transform: translateY(6px); }
  button.issue { background: var(--ink); color: var(--paper); font-size: 1.25rem; box-shadow: 0 4px 0 #000; }
  button.issue:not(:disabled):hover { background: #1E3350; box-shadow: 0 5px 0 #000; }
  button.issue:not(:disabled):active { box-shadow: 0 1px 0 #000; }
  button.repeat:not(:disabled):hover, button.back:not(:disabled):hover { background: #F6F8F6; }
  button.noshow:not(:disabled) { color: var(--stop); border-color: var(--stop); box-shadow: 0 4px 0 var(--stop); }
  button.noshow:not(:disabled):hover { background: #FDECEA; box-shadow: 0 5px 0 var(--stop); }
  button.noshow:not(:disabled):active { box-shadow: 0 1px 0 var(--stop); }
  button.reset { grid-column: 1 / -1; justify-self: start; margin-top: .5rem; padding: .6rem 1.1rem; font-size: 1rem; color: var(--stop); border-color: var(--stop); box-shadow: 0 4px 0 var(--stop); }
  button.reset:not(:disabled):hover { background: #FDECEA; box-shadow: 0 5px 0 var(--stop); }
  button.reset:not(:disabled):active { box-shadow: 0 1px 0 var(--stop); }

  /* The stub mirrors the paper ticket the client is told: perforated edge, number large. */
  .stub { grid-column: 1 / -1; display: flex; align-items: center; gap: 1rem; padding: .8rem 1rem; background: #fff; border-left: 3px dashed var(--line); }
  .stub:empty { display: none; }
  .stub strong { font: 900 2.6rem/1 var(--display); }

  /* Waiting line: every ticket after the one being served. Click to skip, click again to bring back. */
  .line { grid-column: 1 / -1; }
  .line, .insert, .missing { border-top: 1px solid var(--line); padding-top: 1rem; margin-top: .25rem; }
  .line h3 { font: 700 1.35rem/1.2 var(--display); margin: 0 0 .15rem; }
  .line p { margin: 0 0 .75rem; font-size: .9rem; }
  /* padding leaves room for the raised edge and hover lift inside the scroll box */
  .line ol { list-style: none; margin: 0; padding: .2rem .1rem .5rem; display: flex; flex-wrap: wrap; gap: .65rem; max-height: 11rem; overflow-y: auto; }
  .line button { font: 700 1.6rem/1 var(--display); padding: .5rem .9rem; min-width: 4rem; }
  /* Hover previews the click: the chip takes the queue colour. */
  .line button:not([aria-pressed="true"]):hover { background: var(--lane); color: var(--on-lane); }
  .line li:first-child button:not([aria-pressed="true"]) { border-width: 3px; } /* next to be called */
  .line button[aria-pressed="true"] { border-style: dashed; color: #6B7A85; text-decoration: line-through; background: #E4E8E6; box-shadow: none; transform: translateY(4px); }
  .line button[aria-pressed="true"]:hover { background: #fff; color: var(--ink); }

  /* Put a specific number into the line, e.g. a client whose stub went missing. */
  .insert { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
  .insert label { flex: 1 0 100%; font: 700 1.35rem/1.2 var(--display); }
  .insert select { font: 700 1.4rem/1 var(--display); padding: .6rem .7rem; border: 2px solid var(--ink); border-radius: 8px; background: #fff; color: var(--ink); min-width: 12rem;
    box-shadow: inset 0 2px 0 rgb(19 35 58 / .12); cursor: pointer; }
  .insert select:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .insert button { padding: .65rem 1.3rem; background: var(--lane); color: var(--on-lane); font-weight: 700; }
  .insert button:not(:disabled):hover { filter: brightness(1.08); }

  /* Missing stubs: per-queue settings, collapsed by default. */
  .missing { grid-column: 1 / -1; }
  /* The settings toggle looks like a button too. */
  .missing summary { display: inline-block; font-weight: 600; cursor: pointer; padding: .55rem 1rem; border: 2px solid var(--ink); border-radius: 8px; background: #fff;
    box-shadow: 0 3px 0 var(--ink); }
  .missing summary:hover { background: #F6F8F6; }
  .missing[open] summary { background: var(--ink); color: var(--paper); box-shadow: 0 1px 0 var(--ink); transform: translateY(2px); }
  .missing summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .missing p { margin: .4rem 0 .6rem; font-size: .9rem; }
  .missing ol { list-style: none; margin: 0; padding: .2rem .1rem .4rem; display: flex; flex-wrap: wrap; gap: .5rem; }
  .missing button { font: 700 1.15rem/1 var(--display); padding: .4rem .55rem; min-width: 3.2rem; box-shadow: 0 3px 0 var(--ink); }
  .missing button:not([aria-pressed="true"]):hover { background: #F6F8F6; }
  .missing button[aria-pressed="true"] { border-style: dashed; color: #6B7A85; text-decoration: line-through; background: #E4E8E6; box-shadow: none; transform: translateY(3px); }

  /* Start-over confirmation: a toast instead of a blocking browser popup. */
  .toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); width: min(34rem, calc(100% - 2rem));
    background: var(--ink); color: var(--paper); border-left: 6px solid var(--lane); border-radius: 6px; padding: 1rem 1.1rem;
    display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .75rem; box-shadow: 0 8px 24px rgb(19 35 58 / .35); }
  .toast[hidden] { display: none; }
  .toast p { margin: 0; flex: 1 1 100%; line-height: 1.4; }
  .toast button { padding: .6rem 1rem; font-size: 1rem; border-color: var(--paper); background: transparent; color: var(--paper); box-shadow: none; }
  .toast button:focus-visible { outline-color: var(--paper); }
  .toast .confirm { background: var(--stop); border-color: var(--stop); color: #fff; }
  .toast button:not(:disabled):hover, .toast button:not(:disabled):active { box-shadow: none; }
  @media (prefers-reduced-motion: no-preference) { .toast:not([hidden]) { animation: rise .2s ease-out; } }
  @keyframes rise { from { transform: translate(-50%, 1rem); opacity: 0; } }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .lane { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Queue control</h1>
  <fieldset class="counters voice" id="voice" data-for="officer">
    <legend>TV voice</legend>
    <label><input type="radio" name="voice" value="Valkyrie"><span>Valkyrie</span></label>
    <label><input type="radio" name="voice" value="Halliday"><span>Halliday</span></label>
  </fieldset>
  <nav aria-label="Pages">
    <a href="control.html?for=officer">Control</a>
    <a href="control.html?for=desk">Queue Issuance</a>
    <a href="history.html">History</a>
    <a href="display.html" target="_blank">Display</a>
  </nav>
</header>
<form id="unlock" hidden>
  <label for="pw">Enter the control password to use the buttons</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button type="submit">Unlock</button>
</form>
<p id="warn" role="alert"></p>
<main id="queues"></main>
<div class="toast" id="toast" role="alertdialog" aria-labelledby="toastMsg" hidden>
  <p id="toastMsg"></p>
  <button class="cancel" type="button">Keep queue</button>
  <button class="confirm" type="button">Start over</button>
</div>

<script>
const QUEUES = { A: { name: 'ATAP issuance' }, C: { name: 'CL issuance' } };
// Which screen this is: the front desk issues tickets, officers call them (the CSS hides the other job's controls).
const ROLE = ['desk', 'officer'].find((r) => r === new URLSearchParams(location.search).get('for')) ?? '';
if (ROLE) {
  document.body.dataset.role = ROLE;
  document.getElementById('title').textContent = document.title = ROLE === 'desk' ? 'Queue Issuance' : 'Control';
  document.querySelector(`header nav a[href="control.html?for=${ROLE}"]`).setAttribute('aria-current', 'page');
}
// The TV display plays the announcements; this page only sends actions.
const warn = document.getElementById('warn');

let state;
const el = document.getElementById('queues');
el.innerHTML = Object.entries(QUEUES).map(([q, { name }]) => `
  <section class="lane lane-${q}" aria-labelledby="h${q}">
    <div class="board">
      <h2 id="h${q}">${name}</h2>
      <p class="serving" aria-live="polite"><span class="caption">Now serving</span><span id="serving${q}">–</span></p>
      <dl class="facts">
        <div><dt>waiting</dt><dd id="waiting${q}">0</dd></div>
        <div><dt>last ticket issued</dt><dd id="last${q}">–</dd></div>
      </dl>
    </div>
    <div class="actions">
      <fieldset class="counters" data-for="officer">
        <legend>Send the client to</legend>
        ${[1, 2, 3].map((c) => `<label><input type="radio" name="counter${q}" value="${c}"><span>Counter ${c}</span></label>`).join('')}
      </fieldset>
      <button class="call" data-q="${q}" data-type="next" data-for="officer"></button>
      <button class="issue" data-q="${q}" data-type="add" data-for="desk"></button>
      <button class="repeat" data-q="${q}" data-type="recall" data-for="officer">Repeat call</button>
      <button class="noshow" data-q="${q}" data-type="skip" data-for="officer"></button>
      <button class="back" data-q="${q}" data-type="back" data-for="officer"></button>
      <div class="stub" id="stub${q}" aria-live="polite" data-for="desk"></div>
      <div class="line" data-for="officer">
        <h3 id="lineh${q}">Waiting in line</h3>
        <p>Click a number to skip it. Click it again to bring it back.</p>
        <ol id="line${q}" aria-labelledby="lineh${q}"></ol>
      </div>
      <form class="insert" data-q="${q}" data-for="desk">
        <label for="pick${q}">Add a number to the line</label>
        <select id="pick${q}" required></select>
        <button type="submit">Add to line</button>
      </form>
      <details class="missing" data-for="desk">
        <summary id="missingh${q}">Missing stubs (settings)</summary>
        <p>Numbers marked here are never issued or called. The list stays when you start over.</p>
        <ol id="missing${q}" aria-labelledby="missingh${q}"></ol>
      </details>
      <button class="reset" data-q="${q}" data-type="reset" data-for="officer">Start over at ${q}1</button>
    </div>
  </section>`).join('');

const btn = (q, type) => el.querySelector(`[data-q="${q}"][data-type="${type}"]`);
// Internal numbers keep counting past the stub count (31, 32…); people only ever see the stub: 31 → A1.
const stubOf = (n) => ((n - 1) % state.stubs) + 1;
const label = (q, n) => q + stubOf(n);

function render() {
  // Lists and the dropdown are rebuilt below, so remember what had keyboard focus and restore it after.
  const f = document.activeElement;
  const refocus = f?.dataset?.number ? `[data-q="${f.dataset.q}"][data-type="${f.dataset.type}"][data-number="${f.dataset.number}"]`
    : f?.tagName === 'SELECT' ? `#${f.id}` : null;
  for (const q of Object.keys(QUEUES)) {
    const { issued, serving, waiting, skipped, missing, previous } = state[q];
    const noShow = skipped.includes(serving); // skipped while on screen: the screen is blank
    document.getElementById(`serving${q}`).textContent = serving && !noShow ? label(q, serving) : '–';
    document.getElementById(`waiting${q}`).textContent = waiting.length;
    document.getElementById(`last${q}`).textContent = issued ? label(q, issued) : '–';
    // Buttons name the exact number they act on, so staff never work it out.
    const counter = chosenCounter(q);
    btn(q, 'next').textContent = !waiting.length ? 'No one waiting'
      : counter ? `Call ${label(q, waiting[0])} to Counter ${counter}` : 'Choose a counter first';
    btn(q, 'next').disabled = !waiting.length || !counter;
    // Real calling order (re-added numbers can be first), then skipped ones.
    const line = [...waiting, ...skipped];
    document.getElementById(`line${q}`).innerHTML = line.length
      ? line.map((n) => {
          const off = skipped.includes(n);
          return `<li><button type="button" data-q="${q}" data-type="skip" data-number="${n}" aria-pressed="${off}"
            aria-label="${off ? 'Bring back' : 'Skip'} ${label(q, n)}">${label(q, n)}</button></li>`;
        }).join('')
      : '<li>No one is waiting.</li>';
    // Same rule as the server: jump over lost stubs and stubs still held from an earlier round.
    const held = new Set([...waiting, ...skipped, serving].filter(Boolean).map(stubOf));
    let nextIssue = issued + 1;
    while (nextIssue <= issued + state.stubs && (missing.includes(stubOf(nextIssue)) || held.has(stubOf(nextIssue)))) nextIssue++;
    const free = nextIssue <= issued + state.stubs;
    btn(q, 'add').textContent = free ? `Issue ${label(q, nextIssue)}` : 'No free stub: all are in use';
    btn(q, 'add').disabled = !free;
    // Missing-stub toggles (stub numbers); only the list is redrawn, so the <details> stays open or closed.
    let chips = '';
    for (let n = 1; n <= state.stubs; n++) {
      const on = missing.includes(n);
      chips += `<li><button type="button" data-q="${q}" data-type="missing" data-number="${n}" aria-pressed="${on}"
        aria-label="${on ? 'Unmark' : 'Mark'} ${q}${n} as missing">${q}${n}</button></li>`;
    }
    document.getElementById(`missing${q}`).innerHTML = chips;
    document.getElementById(`missingh${q}`).textContent = 'Missing stubs (settings)'
      + (missing.length ? `: ${missing.map((n) => q + n).join(', ')}` : '');
    // Dropdown: every stub. Ones waiting or on screen (in any round) can't be added again; a skipped one comes back.
    const pick = document.getElementById(`pick${q}`), kept = pick.value;
    const has = (list, n) => list.some((x) => stubOf(x) === n);
    let options = '<option value="">Choose a number</option>';
    for (let n = 1; n <= state.stubs; n++) {
      const note = serving && !noShow && stubOf(serving) === n ? ' (now serving)' : has(waiting, n) ? ' (in line)' : missing.includes(n) ? ' (missing stub)' : '';
      const back = !note && has(skipped, n) ? ' (skipped, brings it back)' : '';
      options += `<option value="${n}"${note ? ' disabled' : ''}>${q}${n}${note}${back}</option>`;
    }
    pick.innerHTML = options;
    if (kept && !pick.querySelector(`option[value="${kept}"]`)?.disabled) pick.value = kept;
    btn(q, 'recall').disabled = serving === 0 || noShow;
    // Client on screen didn't come: blank the screen and keep the number as a "bring back" chip.
    const skipBtn = el.querySelector(`.noshow[data-q="${q}"]`);
    skipBtn.dataset.number = serving;
    skipBtn.textContent = serving && !noShow ? `Skip ${label(q, serving)} (didn't come)` : 'Skip number on screen';
    skipBtn.disabled = !serving || noShow;
    // Undo a call: shows the previous number again; the one on screen goes back to the front of the line.
    const prev = previous.at(-1);
    btn(q, 'back').textContent = prev ? `Back to ${label(q, prev.number)}` : 'Back to previous number';
    btn(q, 'back').disabled = !prev;
  }
  document.querySelector(`input[name="voice"][value="${state.voice}"]`).checked = true; // shared by all panels
  if (refocus && document.activeElement !== f) el.querySelector(refocus)?.focus();
}

// Every state update (own actions and polls) goes through here. Redraw only on a real change:
// redrawing rebuilds the dropdown, which would close it if it's open.
let lastJson = '';
function setState(next) {
  const json = JSON.stringify(next);
  if (json === lastJson) return;
  const prev = state;
  state = next;
  lastJson = json;
  render();
  // A call or repeat (from this panel or another one) slides the number in.
  for (const q of Object.keys(QUEUES)) {
    // Started over (here, on another panel, or by the daily restart): the last ticket shown is no longer valid.
    if (prev && next[q].issued < prev[q].issued) document.getElementById(`stub${q}`).innerHTML = '';
    if (prev && next[q].calls > prev[q].calls) {
      const num = document.getElementById(`serving${q}`);
      num.classList.remove('pulled'); void num.offsetWidth; num.classList.add('pulled');
    }
  }
}

const unlock = document.getElementById('unlock');
unlock.addEventListener('submit', (e) => {
  e.preventDefault();
  localStorage.setItem('controlPassword', document.getElementById('pw').value); // remembered on this PC
  unlock.hidden = true;
  warn.textContent = 'Unlocked. Press the button again.';
});

// The chosen counter stays selected (and is remembered on this PC) until changed.
const chosenCounter = (q) => Number(el.querySelector(`input[name="counter${q}"]:checked`)?.value) || 0;
el.addEventListener('change', (e) => {
  if (!e.target.name?.startsWith('counter')) return;
  localStorage.setItem(e.target.name, e.target.value);
  if (state) render(); // before the first poll there is nothing to draw yet
});
for (const q of Object.keys(QUEUES)) {
  const saved = localStorage.getItem(`counter${q}`);
  if (saved) el.querySelector(`input[name="counter${q}"][value="${saved}"]`).checked = true;
}

async function send(queue, type, number, voice) {
  const res = await fetch('/action', {
    method: 'POST',
    headers: { 'X-Control-Password': localStorage.getItem('controlPassword') || '' },
    body: JSON.stringify({ queue, type, number, voice, counter: type === 'next' ? chosenCounter(queue) : undefined }),
  });
  if (res.status === 401) {
    const { error } = await res.json();
    if (error === 'wrong password') {
      localStorage.removeItem('controlPassword');
      unlock.hidden = false;
      document.getElementById('pw').focus();
      warn.textContent = 'That password didn’t work, or none is saved on this PC yet.';
    } else warn.textContent = 'Controls are off: the server has no CONTROL_PASSWORD set.';
    return;
  }
  if (!res.ok) { warn.textContent = 'The server rejected that action: ' + (await res.json()).error; return; }
  warn.textContent = '';
  setState(await res.json());
  const q = state[queue];
  const stub = document.getElementById(`stub${queue}`);
  if (type === 'add') stub.innerHTML = `<strong>${label(queue, q.issued)}</strong><span>Give the client this number.</span>`;
  if (type === 'reset') stub.innerHTML = '';
  if (type === 'insert') {
    const pos = q.waiting.findIndex((n) => stubOf(n) === number) + 1; // number = the stub picked
    const where = pos === 1 ? 'First in line.' : `${pos}${['th', 'st', 'nd', 'rd'][pos % 100 > 10 && pos % 100 < 14 ? 0 : pos % 10] || 'th'} in line.`;
    stub.innerHTML = `<strong>${queue}${number}</strong><span>Added. ${where}</span>`;
  }
}

// Voice is one setting on the server (the TV reads it); a rejected change is put back by render().
document.getElementById('voice').addEventListener('change', (e) => {
  send(undefined, 'voice', undefined, e.target.value)
    .catch(() => (warn.textContent = 'Can’t reach the server. Start it with: node server.js'))
    .finally(() => state && render());
});

const toast = document.getElementById('toast');
let toastTimer, toastOpener;
function closeToast() {
  clearTimeout(toastTimer);
  toast.hidden = true;
  toastOpener?.focus();
}
function askStartOver(opener) {
  const q = opener.dataset.q;
  toastOpener = opener;
  toast.dataset.q = q;
  toast.className = `toast lane-${q}`;
  const waiting = state[q].waiting.length;
  document.getElementById('toastMsg').textContent = `Start ${QUEUES[q].name} over at ${q}1? ` +
    (waiting ? `${waiting} waiting ${waiting === 1 ? 'client loses their' : 'clients lose their'} place.` : 'No one is waiting.');
  toast.hidden = false;
  toast.querySelector('.cancel').focus(); // safe choice gets focus, so Enter can't wipe the queue
  clearTimeout(toastTimer);
  toastTimer = setTimeout(closeToast, 10000); // unanswered = nothing happens
}
toast.addEventListener('click', (e) => {
  if (e.target.matches('.confirm')) {
    send(toast.dataset.q, 'reset').catch(() => (warn.textContent = 'Can’t reach the server. Start it with: node server.js'));
  }
  if (e.target.closest('button')) closeToast();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !toast.hidden) closeToast(); });

el.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b?.dataset.type) return; // e.g. the "Add to line" submit button, handled below
  if (b.dataset.type === 'reset') return askStartOver(b);
  const number = b.dataset.number ? Number(b.dataset.number) : undefined;
  send(b.dataset.q, b.dataset.type, number)
    .catch(() => (warn.textContent = 'Can’t reach the server. Start it with: node server.js'));
});

el.addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.target, q = form.dataset.q, number = Number(form.querySelector('select').value);
  send(q, 'insert', number)
    .then(() => { form.querySelector('select').value = ''; })
    .catch(() => (warn.textContent = 'Can’t reach the server. Start it with: node server.js'));
});

// Other control panels change the queue too: check the server every second, like the TV display.
// shortcut: polling, not push. Switch to Server-Sent Events if many panels or a slow host make it heavy.
const OFFLINE = 'Can’t reach the server. Start it with: node server.js';
async function poll() {
  if (document.hidden) return; // background tabs don't poll; they catch up when shown
  try {
    setState(await (await fetch('/state', { cache: 'no-store' })).json());
    if (warn.textContent === OFFLINE) warn.textContent = '';
  } catch {
    warn.textContent = OFFLINE;
  }
}
poll();
setInterval(poll, 1000);
document.addEventListener('visibilitychange', poll);
</script>
